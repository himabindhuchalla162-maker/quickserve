
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join as Worker - QuickServe</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #0f9d58,
                #087f46
            );

            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 520px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #0f9d58;
            font-size: 32px;
        }

        .logo p {
            color: #777;
            margin-top: 6px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            color: #333;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;
            border-radius: 9px;

            font-size: 15px;

            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #0f9d58;

            box-shadow:
                0 0 0 2px rgba(15,157,88,0.1);
        }

        .register-btn {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;
            border-radius: 9px;

            background: #0f9d58;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .register-btn:hover {
            background: #087f46;
        }

        .message {
            text-align: center;

            margin-top: 15px;

            font-size: 14px;
            font-weight: 600;
        }

        .login-text {
            text-align: center;

            margin-top: 22px;

            color: #666;
        }

        .login-text a {
            color: #0f9d58;

            text-decoration: none;

            font-weight: bold;
        }

        .home-btn {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #555;

            text-decoration: none;

            font-size: 14px;
        }

        .home-btn:hover {
            color: #0f9d58;
        }

        @media (max-width: 550px) {

            .container {
                padding: 25px 20px;
            }

        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">

            <h1>QuickServe</h1>

            <p>
                Join our professional service network
            </p>

        </div>


        <h2>
            Register as a Worker
        </h2>


        <form onsubmit="registerWorker(event)">

            <!-- NAME -->

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="workerName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="workerEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="workerPhone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <!-- SERVICE -->

            <div class="form-group">

                <label>
                    Service
                </label>

                <select id="workerService" required>

                    <option value="">
                        Select your service
                    </option>

                    <option value="Electrician">
                        Electrician
                    </option>

                    <option value="Plumber">
                        Plumber
                    </option>

                    <option value="Carpenter">
                        Carpenter
                    </option>

                    <option value="Painter">
                        Painter
                    </option>

                    <option value="Cleaner">
                        Cleaner
                    </option>

                    <option value="Gardener">
                        Gardener
                    </option>

                </select>

            </div>


            <!-- EXPERIENCE -->

            <div class="form-group">

                <label>
                    Experience
                </label>

                <input
                    type="text"
                    id="workerExperience"
                    placeholder="Example: 5 years"
                    required
                >

            </div>


            <!-- LOCATION -->

            <div class="form-group">

                <label>
                    Location
                </label>

                <input
                    type="text"
                    id="workerLocation"
                    placeholder="Enter your city / area"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="workerPassword"
                    placeholder="Create a password"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="workerConfirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-btn"
            >
                Register as Worker
            </button>

        </form>


        <div
            class="message"
            id="message"
        ></div>


        <div class="login-text">

            Already registered?

            <a href="login.html">
                Login
            </a>

        </div>


        <a
            href="index.html"
            class="home-btn"
        >
            ← Back to Home
        </a>

    </div>


    <script>

        function registerWorker(event) {

            event.preventDefault();


            const name =
                document
                .getElementById("workerName")
                .value
                .trim();


            const email =
                document
                .getElementById("workerEmail")
                .value
                .trim();


            const phone =
                document
                .getElementById("workerPhone")
                .value
                .trim();


            const service =
                document
                .getElementById("workerService")
                .value;


            const experience =
                document
                .getElementById("workerExperience")
                .value
                .trim();


            const location =
                document
                .getElementById("workerLocation")
                .value
                .trim();


            const password =
                document
                .getElementById("workerPassword")
                .value;


            const confirmPassword =
                document
                .getElementById("workerConfirmPassword")
                .value;


            const message =
                document.getElementById("message");


            /* PASSWORD CHECK */

            if (password !== confirmPassword) {

                message.style.color = "red";

                message.textContent =
                    "Passwords do not match!";

                return;
            }


            /* PASSWORD LENGTH */

            if (password.length < 6) {

                message.style.color = "red";

                message.textContent =
                    "Password must be at least 6 characters.";

                return;
            }


            /* WORKER OBJECT */

            const worker = {

                name: name,

                email: email,

                phone: phone,

                service: service,

                experience: experience,

                location: location,

                password: password

            };


            /* SAVE WORKER */

            localStorage.setItem(
                "quickserveWorker",
                JSON.stringify(worker)
            );


            /* SUCCESS MESSAGE */

            message.style.color = "#0f9d58";

            message.textContent =
                "Worker registration successful!";


            /* GO TO LOGIN */

            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1000);

        }

    </script>

</body>
</html>
