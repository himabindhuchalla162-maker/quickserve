<!DOCTYPE html>
<html>
<head>
    <title>QuickServe - Worker Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>QuickServe</h1>
    <h2>Worker Registration</h2>

    <form>

        <label>Full Name</label><br>
        <input type="text" placeholder="Enter your name"><br><br>

        <label>Mobile Number</label><br>
        <input type="tel" placeholder="Enter mobile number"><br><br>

        <label>Email</label><br>
        <input type="email" placeholder="Enter email"><br><br>

        <label>Select Service</label><br>
        <select>
            <option>Electrician</option>
            <option>Plumber</option>
            <option>Carpenter</option>
            <option>Cleaning</option>
            <option>AC Repair</option>
        </select><br><br>

        <label>Experience</label><br>
        <input type="number" placeholder="Years of experience"><br><br>

        <label>Location</label><br>
        <input type="text" placeholder="Enter your location"><br><br>

        <button type="submit">Register</button>

    </form>

</body>
</html>
