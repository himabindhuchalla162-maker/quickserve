<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - QuickServe</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8f5;
            min-height: 100vh;
        }

        .navbar {
            background: #198754;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .home-btn {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 60px auto;
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #198754;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #198754;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #146c43;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .signup-text {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .signup-text a {
            color: #198754;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">QuickServe</div>

        <a href="index.html" class="home-btn">
            Home
        </a>
    </div>


    <div class="container">

        <div class="login-box">

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Login to your QuickServe account
            </p>


            <form id="loginForm">

                <label for="accountType">
                    Account Type
                </label>

                <select id="accountType" required>

                    <option value="">
                        Select Account Type
                    </option>

                    <option value="customer">
                        Customer
                    </option>

                    <option value="worker">
                        Worker
                    </option>

                </select>


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <div
                id="message"
                class="message"
            ></div>


            <div class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Customer Signup
                </a>

                <br><br>

                Are you a worker?

                <a href="worker-signup.html">
                    Worker Signup
                </a>

            </div>

        </div>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const accountType =
                    document.getElementById("accountType").value;

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value.trim();

                const message =
                    document.getElementById("message");


                if (accountType === "") {

                    message.style.color = "red";

                    message.textContent =
                        "Please select account type.";

                    return;
                }


                /* =========================
                   CUSTOMER LOGIN
                ========================= */

                if (accountType === "customer") {

                    const savedUser =
                        localStorage.getItem("quickserveUser");


                    if (!savedUser) {

                        message.style.color = "red";

                        message.textContent =
                            "No customer account found. Please signup first.";

                        return;
                    }


                    const user =
                        JSON.parse(savedUser);


                    if (
                        user.email === email &&
                        user.password === password
                    ) {

                        localStorage.setItem(
                            "quickserveLoggedIn",
                            "true"
                        );

                        localStorage.setItem(
                            "quickserveLoggedInUser",
                            user.fullName
                        );

                        localStorage.setItem(
                            "quickserveAccountType",
                            "customer"
                        );


                        message.style.color = "green";

                        message.textContent =
                            "Customer login successful!";


                        setTimeout(function() {

                            window.location.href =
                                "index.html";

                        }, 800);


                    } else {

                        message.style.color = "red";

                        message.textContent =
                            "Invalid customer email or password.";

                    }

                }


                /* =========================
                   WORKER LOGIN
                ========================= */

                else if (accountType === "worker") {

                    const savedWorker =
                        localStorage.getItem("quickserveWorker");


                    if (!savedWorker) {

                        message.style.color = "red";

                        message.textContent =
                            "No worker account found. Please signup first.";

                        return;
                    }


                    const worker =
                        JSON.parse(savedWorker);


                    if (
                        worker.email === email &&
                        worker.password === password
                    ) {

                        localStorage.setItem(
                            "quickserveLoggedIn",
                            "true"
                        );

                        localStorage.setItem(
                            "quickserveLoggedInUser",
                            worker.name
                        );

                        localStorage.setItem(
                            "quickserveAccountType",
                            "worker"
                        );


                        message.style.color = "green";

                        message.textContent =
                            "Worker login successful!";


                        /* IMPORTANT:
                           WORKER → WORKER DASHBOARD
                        */

                        setTimeout(function() {

                            window.location.href =
                                "worker-dashboard.html";

                        }, 800);


                    } else {

                        message.style.color = "red";

                        message.textContent =
                            "Invalid worker email or password.";

                    }

                }

            });

    </script>

</body>
</html>
