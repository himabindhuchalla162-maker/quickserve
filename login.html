<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickServe - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eafaf2, #f8fffb);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 400px;
            max-width: 90%;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #183b2b;
            margin-bottom: 10px;
        }

        .logo span {
            color: #16a36a;
        }

        .subtitle {
            color: #718279;
            margin-bottom: 30px;
        }

        h2 {
            color: #183b2b;
            margin-bottom: 25px;
        }

        .input-box {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #355346;
        }

        .input-box input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8e5df;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .input-box input:focus {
            border-color: #16a36a;
        }

        .login-submit {
            width: 100%;
            padding: 14px;
            background: #16a36a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-submit:hover {
            background: #128555;
        }

        .back-home {
            display: inline-block;
            margin-top: 20px;
            color: #16a36a;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <span>Quick</span>Serve
        </div>

        <p class="subtitle">
            Trusted Services. Right at Your Doorstep.
        </p>

        <h2>Login to QuickServe</h2>

        <form id="loginForm">

            <div class="input-box">
                <label>Email or Mobile Number</label>
                <input
                    type="text"
                    id="userInput"
                    placeholder="Enter email or mobile number"
                    required
                >
            </div>

            <div class="input-box">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-submit">
                Login
            </button>

        </form>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>


    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            alert("Login system is ready! Backend connection will be added next.");

        });
    </script>

</body>
</html>
