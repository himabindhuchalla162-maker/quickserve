
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Confirmed - QuickServe</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4fff6;
            color: #333;
        }

        header {
            background: #0f9d58;
            color: white;
            padding: 18px 60px;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            color: #0f9d58;
            margin-bottom: 25px;
        }

        .details {
            background: #e8f8ee;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
        }

        .details p {
            margin: 12px 0;
        }

        .details strong {
            color: #087f46;
        }

        .home-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #0f9d58;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .home-btn:hover {
            background: #087f46;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">QuickServe</div>
    </header>


    <div class="container">

        <div class="success-icon">
            ✅
        </div>

        <h1>Booking Confirmed!</h1>


        <div class="details">

            <p>
                <strong>Worker:</strong>
                <span id="worker"></span>
            </p>

            <p>
                <strong>Service:</strong>
                <span id="service"></span>
            </p>

            <p>
                <strong>Customer Name:</strong>
                <span id="name"></span>
            </p>

            <p>
                <strong>Phone:</strong>
                <span id="phone"></span>
            </p>

            <p>
                <strong>Address:</strong>
                <span id="address"></span>
            </p>

            <p>
                <strong>Date:</strong>
                <span id="date"></span>
            </p>

            <p>
                <strong>Time:</strong>
                <span id="time"></span>
            </p>

            <p>
                <strong>Service Details:</strong>
                <span id="details"></span>
            </p>

        </div>


        <a href="index.html" class="home-btn">
            Back to Home
        </a>

    </div>


    <script>

        document.getElementById("worker").textContent =
            localStorage.getItem("bookingWorker") || "";

        document.getElementById("service").textContent =
            localStorage.getItem("bookingService") || "";

        document.getElementById("name").textContent =
            localStorage.getItem("bookingName") || "";

        document.getElementById("phone").textContent =
            localStorage.getItem("bookingPhone") || "";

        document.getElementById("address").textContent =
            localStorage.getItem("bookingAddress") || "";

        document.getElementById("date").textContent =
            localStorage.getItem("bookingDate") || "";

        document.getElementById("time").textContent =
            localStorage.getItem("bookingTime") || "";

        document.getElementById("details").textContent =
            localStorage.getItem("bookingDetails") || "";

    </script>

</body>
</html>
