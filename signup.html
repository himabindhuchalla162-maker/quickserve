
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - QuickServe</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f9d58, #087f46);
            padding: 20px;
        }

        .signup-container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #0f9d58;
            font-size: 32px;
        }

        .logo p {
            color: #777;
            margin-top: 6px;
        }

        h2 {
            text-align: center;
            color: #222;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #0f9d58;
            box-shadow: 0 0 0 2px rgba(15, 157, 88, 0.1);
        }

        .signup-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #0f9d58;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .signup-btn:hover {
            background: #087f46;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .login-text a {
            color: #0f9d58;
            text-decoration: none;
            font-weight: bold;
        }

        .home-btn {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .home-btn:hover {
            color: #0f9d58;
        }

        @media (max-width: 500px) {
            .signup-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="logo">
            <h1>QuickServe</h1>
            <p>Your trusted service platform</p>
        </div>

        <h2>Create Account</h2>

        <form onsubmit="createAccount(event)">

            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <button type="submit" class="signup-btn">
                Create Account
            </button>

        </form>

        <div class="message" id="message"></div>

        <div class="login-text">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

        <a href="index.html" class="home-btn">
            ← Back to Home
        </a>

    </div>


    <script>

        function createAccount(event) {

            event.preventDefault();

            const fullName = document.getElementById("fullName").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message = document.getElementById("message");


            // Check password
            if (password !== confirmPassword) {

                message.style.color = "red";
                message.textContent = "Passwords do not match!";

                return;
            }


            // Check password length
            if (password.length < 6) {

                message.style.color = "red";
                message.textContent =
                    "Password must be at least 6 characters.";

                return;
            }


            // Create user object
            const user = {

                fullName: fullName,
                email: email,
                phone: phone,
                password: password

            };


            // Save user in browser
            localStorage.setItem(
                "quickserveUser",
                JSON.stringify(user)
            );


            message.style.color = "#0f9d58";
            message.textContent =
                "Account created successfully!";


            // Go to login page after 1 second
            setTimeout(function () {

                window.location.href = "login.html";

            }, 1000);

        }

    </script>

</body>
</html>
